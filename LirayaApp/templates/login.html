{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LIRAYA Login</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'css/shared_alert.css' %}" />

  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style_login.css' %}" />
</head>
<body>

<div class="container-fluid">
  <!-- Left Panel -->
  <div class="left-panel">
    <a href="{% url 'user_homepage' %}">
      <img src="{% static 'images/liraya.png' %}" alt="LIRAYA Logo">
    </a>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="text-center mb-3">
      <img src="{% static 'images/profile.png' %}" alt="Profile Icon" class="profile-icon mb-2">
      <h3 class="fw-bold mt-2">LIBRARY MANAGEMENT PORTAL</h3>
    </div>

    <!-- Show error message if it exists -->
    {% if messages %}
      {% for message in messages %}
        <div class="error-alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <script src="{% static 'script/message_alert.js' %}"></script>
    
    <form class="form-container" method="post" action="{% url 'login' %}">
      {% csrf_token %}

      <label class="form-label">USERNAME:</label>
      <div class="input-wrapper">
        <img src="{% static 'images/username.png' %}" alt="Username Icon" class="input-icon" />
        <input type="text" name="username" class="form-control" placeholder="Enter username">
      </div>

      <label class="form-label">PASSWORD:</label>
      <div class="input-wrapper password-container">
        <img src="{% static 'images/password.png' %}" alt="Password Icon" class="input-icon" />
        <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter password">
        <img src="{% static 'images/hidden_eye_white.png' %}" 
            class="eye-icon" 
            id="eye-icon-login-password" 
            onclick="togglePassword('login-password')">
      </div>

      <div class="text-end mt-2">
        <a href="{% url 'forgot_password' %}" class="text-light small">Forgot password?</a>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-outline-light rounded-pill">Sign In</button>
      </div>

      <div class="text-center">
        <a href="{% url 'social:begin' 'google-oauth2' %}" class="btn btn-light d-flex align-items-center justify-content-center mx-auto rounded-pill px-3">
          <img src="{% static 'images/google.png' %}" alt="Google icon" class="me-2">
          Log in with Google
        </a>

      </div>

    </form>
  </div>
</div>

<!-- JS -->
<script src="{% static 'script/toggle_password.js' %}"></script>

</body>
</html>
